name: CI

# No Linux job: a Tauri Linux build needs a webkitgtk apt setup that is real
# work on its own (see plan 009's maintenance notes). Deliberately deferred.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify (cargo check, cargo test, tsc, frontend build)
        run: npm run verify

      # Plan 058. This COMPILES SPEC.md §8's #[cfg(windows)] code — Job Objects,
      # raw_arg, CREATE_NO_WINDOW — for the Windows target. It does not RUN any
      # of it: nothing here proves TerminateJobObject kills anything. Only the
      # `windows` job below executes that code, on a real Windows machine.
      #
      # It also deliberately omits the TLS stack: --no-default-features drops the
      # `github` feature, and with it reqwest -> rustls -> aws-lc-sys, whose C
      # build script needs windows.h and cannot build on macOS. The GitHub slice
      # is therefore NOT covered by this step — `npm run verify` above covers it
      # on the host, and the `windows` job covers it on Windows.
      #
      # It belongs on macOS because the `windows` job builds everything natively
      # and does not need a cross-check. The value here is speed: seconds on this
      # job versus waiting for a separate runner.
      #
      # Guard against a silent regression: if a crate with a C build script ever
      # lands in the default-off path, this reverts to failing inside a
      # dependency having verified nothing about Hangar. The grep below is what
      # catches that — cargo must actually reach and compile our crate.
      - name: Windows cross-check (compile only, no TLS stack)
        run: |
          set -eo pipefail
          # tauri-winres shells out to a Windows resource compiler during
          # tauri-build's build script. Without one it panics with
          # NotAttempted("llvm-rc") BEFORE any of src-tauri/src/ is typechecked,
          # so the gate would report failure having verified nothing. Homebrew
          # keeps llvm keg-only, hence the explicit PATH.
          LLVM_BIN="$(brew --prefix llvm 2>/dev/null || echo /opt/homebrew/opt/llvm)/bin"
          export PATH="$LLVM_BIN:$PATH"
          rustup target add x86_64-pc-windows-msvc
          # Force our own crate to rebuild. Without this the grep below is a
          # coin-flip against the cache: when nothing is stale cargo prints
          # neither "Compiling" nor "Checking", only "Finished", and the gate
          # fails while the check actually passed. Measured locally on
          # 2026-08-11 — the first run after a merge printed 0 matches and read
          # exactly like a regression. Cleaning one package costs seconds and
          # makes the signal mean one thing.
          cargo clean -p hangar --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc || true
          cargo check --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc --no-default-features --all-targets \
            2>&1 | tee "$RUNNER_TEMP/cross-check.log"
          # "Compiling hangar" is what cargo prints when our crate's build script
          # is (re)built; on an incremental run where only the check unit is stale
          # it prints "Checking hangar" instead. Either proves the same thing —
          # cargo reached Hangar's own sources — which is the whole point. Neither
          # means it died inside a dependency's build script, and the run verified
          # nothing about §8 no matter what cargo's exit code said.
          if ! grep -Eq "(Compiling|Checking) hangar" "$RUNNER_TEMP/cross-check.log"; then
            echo "::error::Windows cross-check never reached Hangar's own code — it died in a dependency. See plan 058."
            exit 1
          fi

  acceptance:
    name: acceptance (macOS, serial)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runners have `node` on PATH, and --test-threads=1 (baked into the
      # npm script) makes the machine-wide `pgrep` process counting safe on
      # a fresh runner.
      - name: Run ignored acceptance tests
        run: npm run test:acceptance

  bundle:
    name: bundle (macOS)
    runs-on: macos-latest
    # Informative, not blocking: this job exists to catch bundling regressions
    # (icons, identifier, signing) early, but a signing/toolchain hiccup on a
    # hosted runner must not block the `host` job that gates real correctness.
    # Same reasoning as the `windows` job below, applied to bundling instead
    # of testing. No Linux or Windows bundle job here: Linux needs webkitgtk
    # apt setup (see the top-of-file comment) and Windows bundling is
    # untested in this repo — both deliberately deferred.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run build:app

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: hangar-macos
          path: src-tauri/target/release/bundle/

  windows:
    name: windows
    runs-on: windows-latest
    # Informative, not blocking: macOS is the current development platform
    # (SPEC.md §15 test 9). This job still compiles and RUNS the #[cfg(windows)]
    # kill path — Job Objects, TerminateJobObject, the taskkill fallback — and a
    # red result here is a real finding worth a plan. Flip this back to blocking
    # when Windows becomes a supported target in earnest.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the frontend into dist/, which cargo test may expect to exist
      # even though it doesn't need to run it (tauri::generate_context! reads
      # frontendDist at compile time).
      - name: Build frontend
        run: npm run build

      # Cheap, fast check before the full test build below: --all-targets
      # typechecks test code too, not just the library, so a #[cfg] mistake
      # (e.g. a Unix-only test missing #[cfg(unix)]) fails here in seconds
      # with a clear E0425 instead of midway through compiling the test binary.
      - name: Check (all targets, including tests)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # First place the #[cfg(windows)] kill path (Job Object creation,
      # assignment, TerminateJobObject extern) actually compiles AND runs its
      # unit tests, not just typechecks. Deliberately not running
      # test:acceptance here — those tests use pgrep/Unix fixtures.
      - name: Run cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
