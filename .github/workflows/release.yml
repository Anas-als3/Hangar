name: Release

# Builds and publishes a GitHub Release when a `v*` tag is pushed. This is
# plan 044 (tier 1 of plan 024): an unsigned macOS arm64 .dmg for sharing
# with people who can be told "right-click -> Open -> Open" (see README's
# Gatekeeper paragraph). No signing, no notarisation, no Windows/Linux
# artifact, no updater plugin -- see plan 024 for why each is out of scope.
#
# Deliberately separate from ci.yml's `bundle` job: `bundle` runs on every
# push and tolerates failure (see its own comment in ci.yml) so a bundling
# hiccup never blocks the job that gates correctness. A release must be loud
# when it fails, so nothing in this job tolerates failure the way `bundle`
# does, and it only runs on a tag push, never on branch pushes (ci.yml
# already owns those).

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: release (macOS)
    runs-on: macos-latest
    permissions:
      # Job-scoped (not workflow-wide): needed so the "Create Release" step
      # below can create a GitHub Release and upload the .dmg to it.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check package.json and tauri.conf.json versions agree
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            if (pkg !== tauri) {
              console.error("Version mismatch: package.json=" + pkg + " src-tauri/tauri.conf.json=" + tauri);
              process.exit(1);
            }
            const tag = process.env.GITHUB_REF_NAME || "";
            const m = tag.match(/^v(\d+\.\d+\.\d+)$/);
            if (m && m[1] !== pkg) {
              console.error("Tag " + tag + " does not match version " + pkg + " -- package.json and tauri.conf.json agree with each other but not with the tag");
              process.exit(1);
            }
            console.log("Version check passed: " + pkg + " (tag " + tag + ")");
          '

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle
        run: npm run build:app

      # Uses the `gh` CLI, preinstalled on GitHub-hosted runners -- chosen
      # over a third-party release Action (e.g. softprops/action-gh-release)
      # so this workflow adds no Action beyond what ci.yml already uses.
      - name: Create Release and attach .dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            --title "${{ github.ref_name }}" \
            --notes "Unsigned macOS (arm64) build, not signed with an Apple Developer certificate. macOS Gatekeeper will say \"Hangar is damaged and can't be opened\" on first launch -- this is expected, not a bug. Fix: right-click the app -> Open -> Open (once)."
