[package]
name = "hangar"
version = "0.1.0"
description = "Hangar — a launch bay for local dev projects"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
# The generated `[lib]` target was removed: SPEC.md §13 puts the builder, plugins and state
# in `main.rs`, and Hangar is desktop-only (no mobile entry point to expose).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Exactly the three plugins SPEC.md §4 allows. The shell, fs and store plugins are forbidden.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio is used for its types only — no runtime is created here (SPEC.md §4).
# DEVIATION from §4's literal feature list: `net` is added for `tokio::net::TcpStream`, which is the
# dual-stack port probe §8 verification and §9's ready-check are both specified in terms of. The
# alternative (blocking `std::net` connects on the blocking pool) would still be "tokio types only"
# but burns a thread per probe; this keeps the spec's intent — tokio types, no runtime of our own.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "net"] }
# Justification (SPEC.md §4 dependency rule): SPEC.md §9 step 3 hashes the lockfile with SHA-256 to
# decide whether an install is needed; std has no hashing primitive, and pulling in a general crypto
# crate for one digest would be overkill next to this focused, dependency-light implementation.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Justification (SPEC.md §4 dependency rule): SPEC.md §8's Unix kill is `kill(-pgid, SIGTERM/SIGKILL)`
# and its verification is `kill(-pgid, 0) == ESRCH`. std can only signal a single `Child`, and has no
# way to address a process group or to probe for liveness — `libc::kill` is the only route.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects (SPEC.md §4/§8) — justification: `taskkill /T` walks live PPID chains and so cannot
# guarantee a tree kill; KILL_ON_JOB_CLOSE also reaps every child if Hangar itself dies.
win32job = "2"
