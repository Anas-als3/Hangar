[package]
name = "hangar"
version = "0.1.0"
description = "Hangar — a launch bay for local dev projects"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
# The generated `[lib]` target was removed: SPEC.md §13 puts the builder, plugins and state
# in `main.rs`, and Hangar is desktop-only (no mobile entry point to expose).

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Plan 058 — the ONLY reason this feature exists. It is default-ON, so every shipped build,
# `cargo check`, `cargo test` and bundle contains the GitHub slice exactly as before; nothing about
# the app changes. What it buys is `--no-default-features`, which drops `reqwest` and therefore
# `rustls -> aws-lc-sys`, whose C build script needs `windows.h` and so cannot build on macOS. That
# build script is what broke `cargo check --target x86_64-pc-windows-msvc`, and with it the ONLY
# verification SPEC.md §8's `#[cfg(windows)]` Job Object code has on this machine. Turning the
# feature off is how the cross-check reaches Hangar's own sources again:
#
#   PATH="/opt/homebrew/opt/llvm/bin:$PATH" cargo check --manifest-path src-tauri/Cargo.toml \
#     --target x86_64-pc-windows-msvc --no-default-features --all-targets
#
# It proves the Windows code COMPILES. It does not run it — only CI's `windows` job does that.
#
# Plan 059 added `osv` on the same terms and for the same single reason: it is the other thing that
# needs `reqwest`. It is a SEPARATE feature rather than a second use of `github` because it is not
# GitHub — turning the GitHub slice off must not silently also turn off an unrelated dependency
# check — and the two modules never reference each other, so they gate independently. The command
# above is unchanged: `--no-default-features` still drops BOTH, and with them `reqwest`.
[features]
default = ["github", "osv"]
github = ["dep:reqwest", "dep:keyring"]
osv = ["dep:reqwest"]

[dependencies]
tauri = { version = "2", features = [] }
# Exactly the three plugins SPEC.md §4 allows. The shell, fs and store plugins are forbidden.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio is used for its types only — no runtime is created here (SPEC.md §4).
# DEVIATION from §4's literal feature list: `net` is added for `tokio::net::TcpStream`, which is the
# dual-stack port probe §8 verification and §9's ready-check are both specified in terms of. The
# alternative (blocking `std::net` connects on the blocking pool) would still be "tokio types only"
# but burns a thread per probe; this keeps the spec's intent — tokio types, no runtime of our own.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "net"] }
# Justification (SPEC.md §4 dependency rule): SPEC.md §9 step 3 hashes the lockfile with SHA-256 to
# decide whether an install is needed; std has no hashing primitive, and pulling in a general crypto
# crate for one digest would be overkill next to this focused, dependency-light implementation.
sha2 = "0.10"
# Justification (SPEC.md §18 / plan 053): the ONE credential Hangar ever holds — a GitHub personal
# access token — must live in the OS keychain with NO disk fallback (§18); std has no keychain
# access at all. Explicit backends per platform (not the crate's own defaults, which omit macOS)
# so "keychain unavailable" is a compile-time fact, never a silent runtime guess.
# `optional` only because of the `github` feature above — the justification is unchanged.
keyring = { version = "4", optional = true, features = ["apple-native-keyring-store", "windows-native-keyring-store"] }
# Justification (SPEC.md §18 / plan 053): §18 permits exactly one network call site — the GitHub
# API over TLS. `default-features = false` + `rustls`/`json` keeps this to rustls (never OpenSSL,
# never native-tls) and JSON bodies only — no cookies, multipart, blocking client or HTTP/3.
# DEVIATION: SPEC.md's own snippet names the historic `rustls-tls` feature; reqwest 0.13 renamed it
# to `rustls` upstream. Kept the spec's INTENT (rustls, never OpenSSL) per CLAUDE.md's "trust the
# compiler and current docs" rule — verified with `cargo tree`: no `openssl*` crate appears anywhere.
# `optional` only because of the `github` feature above — the justification is unchanged.
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls", "json"] }

[target.'cfg(unix)'.dependencies]
# Justification (SPEC.md §4 dependency rule): SPEC.md §8's Unix kill is `kill(-pgid, SIGTERM/SIGKILL)`
# and its verification is `kill(-pgid, 0) == ESRCH`. std can only signal a single `Child`, and has no
# way to address a process group or to probe for liveness — `libc::kill` is the only route.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects (SPEC.md §4/§8) — justification: `taskkill /T` walks live PPID chains and so cannot
# guarantee a tree kill; KILL_ON_JOB_CLOSE also reaps every child if Hangar itself dies.
win32job = "2"
